[project]
name = "bse-nlq"
version = "0.1.0"
description = "Natural Language Query agent over a BSE ticketing database (candidate exercise)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "sqlglot>=25",
    "rich>=13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[project.scripts]
nlq = "bse_nlq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bse_nlq"]
artifacts = ["src/bse_nlq/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: requires ANTHROPIC_API_KEY and makes real API calls"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: undefined names, unused imports
    "UP",        # pyupgrade
    "B",         # bugbear: likely bugs (incl. zip without strict=)
    "SIM",       # simplifiable code
    "RET",       # return-statement hygiene
    "ARG",       # unused arguments
    "PTH",       # prefer pathlib over os.path
    "C90",       # cyclomatic complexity
    "I",         # import sorting
]
ignore = ["E501"]   # line length is handled by the formatter, not the linter

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on private helpers and build throwaway objects.
"tests/*" = ["ARG001"]
