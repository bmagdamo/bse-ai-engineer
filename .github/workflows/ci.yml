name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Build the database
        # Deterministic anchor so CI results do not drift with the calendar.
        run: uv run python data/seed.py --anchor-date 2026-06-15

      - name: Test
        # The `llm` marker is excluded: those tests make real API calls. They
        # run locally with a key (see README) and are not gated on in CI.
        run: uv run pytest -m "not llm" -q
